<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>go.neuralnet.cpp 对弈室</title>
<style>
  :root {
    --bg: #12171f;
    --panel: #1a212b;
    --panel-2: #212a36;
    --line: #2c3745;
    --text: #e8edf4;
    --muted: #96a2b1;
    --gold: #dcae5c;
    --gold-2: #f0c674;
    --red: #e05a4f;
    --green: #63c68f;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1100px 520px at 85% -8%, rgba(220, 174, 92, 0.12), rgba(0, 0, 0, 0) 62%),
      radial-gradient(900px 520px at -8% 18%, rgba(96, 132, 196, 0.10), rgba(0, 0, 0, 0) 60%),
      var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* ---------- 顶部标题栏 ---------- */
  .topbar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 13px 22px;
    background: linear-gradient(180deg, rgba(31, 39, 51, 0.96), rgba(22, 28, 37, 0.92));
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; color: var(--gold-2); white-space: nowrap; }
  .tabs {
    display: flex; gap: 6px; background: rgba(255, 255, 255, 0.05);
    padding: 4px; border-radius: 999px; border: 1px solid var(--line);
  }
  .tab {
    border: 0; background: transparent; color: var(--muted);
    padding: 7px 18px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: #2a2110; font-weight: 700;
  }
  .badge {
    margin-left: auto; display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 14px; color: var(--muted); font-size: 12.5px;
    max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .badge b { color: var(--gold-2); font-weight: 600; }

  /* ---------- 错误提示条（可关闭，不用原生弹窗） ---------- */
  .error-bar {
    display: flex; align-items: center; gap: 12px;
    margin: 12px 22px 0; padding: 10px 14px;
    background: rgba(224, 90, 79, 0.14); border: 1px solid rgba(224, 90, 79, 0.45);
    color: #ffd7d2; border-radius: 12px;
  }
  .error-close {
    margin-left: auto; background: transparent; border: 0; color: #ffd7d2;
    font-size: 19px; cursor: pointer; line-height: 1;
  }

  /* ---------- 主体布局：宽屏左右，窄屏上下 ---------- */
  .layout {
    display: grid; grid-template-columns: minmax(0, 1fr) 384px;
    gap: 18px; padding: 18px 22px 34px; align-items: start;
  }
  .side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .side .card + .card { margin-top: 0; }
  @media (max-width: 980px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .badge { max-width: 100%; }
  }

  .card {
    background: linear-gradient(180deg, rgba(34, 42, 54, 0.92), rgba(26, 33, 43, 0.92));
    border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
    padding: 16px;
  }
  .card + .card { margin-top: 16px; }
  h2 {
    margin: 0 0 12px; font-size: 15px; color: var(--gold-2);
    font-weight: 700; letter-spacing: 0.5px;
  }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  /* ---------- 棋盘区 ---------- */
  .board-toolbar {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 12px;
  }
  .switch {
    display: inline-flex; align-items: center; gap: 7px; color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .switch input { width: 16px; height: 16px; accent-color: var(--gold); cursor: pointer; }
  .board-wrap { position: relative; width: 100%; max-width: 820px; margin: 0 auto; }
  #board {
    width: 100%; aspect-ratio: 1 / 1; display: block; border-radius: 12px;
    box-shadow: 0 18px 36px rgba(0, 0, 0, 0.38); cursor: pointer;
  }
  #board.locked { cursor: default; }
  .result-banner {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(20, 25, 33, 0.92); border: 1px solid var(--gold);
    color: var(--gold-2); padding: 10px 22px; border-radius: 999px;
    font-size: 17px; font-weight: 700; white-space: nowrap;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
  }
  .eval-note {
    margin-top: 12px; color: var(--muted); min-height: 22px; text-align: center;
  }
  .eval-note b { color: var(--gold-2); }

  /* ---------- 信息卡 / 按钮 ---------- */
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .info-row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 7px 10px; background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 9px;
  }
  .info-row span { color: var(--muted); white-space: nowrap; }
  .info-row b {
    font-weight: 600; text-align: right; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; max-width: 62%;
  }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .btn {
    border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06);
    color: var(--text); padding: 9px 15px; border-radius: 10px;
    cursor: pointer; font-size: 13.5px;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.12); }
  .btn.primary {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    border-color: transparent; color: #2b2210; font-weight: 700;
  }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.danger { border-color: rgba(224, 90, 79, 0.55); color: #ffb4ac; }
  .btn.danger:hover { background: rgba(224, 90, 79, 0.16); }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* ---------- 新对局小面板 ---------- */
  .sub-panel {
    margin-top: 14px; padding: 14px; border: 1px dashed var(--line);
    border-radius: 12px; background: rgba(255, 255, 255, 0.035);
  }
  .sub-title { color: var(--gold-2); font-weight: 700; margin-bottom: 10px; }
  .choice-row {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    margin-bottom: 10px; color: var(--muted);
  }
  .choice-row label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .choice-row input[type="number"] {
    width: 92px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--line);
    color: var(--text); border-radius: 8px; padding: 6px 8px;
  }

  /* ---------- 竞技台记分板 ---------- */
  .score-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .score-cell {
    text-align: center; padding: 12px 8px; border-radius: 12px;
    border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04);
  }
  .score-cell.black { border-color: rgba(220, 174, 92, 0.38); }
  .score-cell.white { border-color: rgba(255, 255, 255, 0.2); }
  .score-name {
    font-size: 12.5px; color: var(--muted); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .score-num { font-size: 26px; font-weight: 800; color: var(--gold-2); line-height: 1.3; }
  .score-cell.white .score-num { color: #f2f5f9; }
  .score-sub { font-size: 11px; color: var(--muted); }
  .winbar {
    display: flex; height: 12px; border-radius: 999px; overflow: hidden;
    margin: 14px 0 4px; border: 1px solid var(--line);
  }
  .wb-black { background: linear-gradient(90deg, #3a3f47, #555b64); }
  .wb-draw { background: #6c7480; }
  .wb-white { background: linear-gradient(90deg, #cfd6de, #ffffff); }

  .ctrl-row { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .slider-label {
    display: flex; align-items: center; gap: 10px; color: var(--muted);
  }
  .slider-label input[type="range"] { flex: 1; accent-color: var(--gold); }
  .slider-label b { color: var(--gold-2); min-width: 96px; text-align: right; }

  /* ---------- 走子列表 ---------- */
  .move-list {
    list-style: none; margin: 0; padding: 4px; max-height: 262px; overflow-y: auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 6px;
  }
  .move-list li {
    display: flex; align-items: center; gap: 7px; padding: 5px 8px;
    border-radius: 8px; background: rgba(255, 255, 255, 0.035);
    border: 1px solid transparent;
  }
  .move-list li.current { border-color: var(--gold); background: rgba(220, 174, 92, 0.15); }
  .mv-n { color: var(--muted); font-size: 11.5px; min-width: 22px; }
  .mv-dot {
    width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block;
  }
  .mv-dot.black { background: #0e1116; border: 1px solid #6b7684; }
  .mv-dot.white { background: #eef2f7; border: 1px solid #9aa5b1; }
  .mv-coord { font-weight: 600; letter-spacing: 0.4px; }

  .blink { animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">&#9876; go.neuralnet.cpp 对弈室</div>
  <nav class="tabs">
    <button class="tab active" data-mode="play" type="button">对弈</button>
    <button class="tab" data-mode="arena" type="button">竞技台</button>
  </nav>
  <div class="badge" id="engineBadge">引擎：加载中…</div>
</header>

<div class="error-bar hidden" id="errorBar">
  <span id="errorText"></span>
  <button class="error-close" id="errorClose" type="button" title="关闭提示">&times;</button>
</div>

<main class="layout">
  <section class="card">
    <div class="board-toolbar">
      <label class="switch"><input type="checkbox" id="toggleNumbers"> 显示手数</label>
      <label class="switch"><input type="checkbox" id="toggleAi"> AI 视角</label>
      <button class="btn ghost" id="btnEval" type="button">形势判断</button>
      <span class="muted" id="boardHint"></span>
    </div>
    <div class="board-wrap" id="boardWrap">
      <canvas id="board"></canvas>
      <div class="result-banner hidden" id="resultBanner"></div>
    </div>
    <div class="eval-note" id="evalNote"></div>
  </section>

  <aside class="side">
    <!-- 对弈面板 -->
    <section class="card" id="playPanel">
      <h2>对局信息</h2>
      <div class="info-grid">
        <div class="info-row"><span>执子</span><b id="infoHuman">—</b></div>
        <div class="info-row"><span>贴目 komi</span><b id="infoKomi">—</b></div>
        <div class="info-row"><span>提子</span><b id="infoCaptures">—</b></div>
        <div class="info-row"><span>手数</span><b id="infoMoves">—</b></div>
        <div class="info-row"><span>轮到</span><b id="infoTurn">—</b></div>
        <div class="info-row"><span>引擎</span><b id="infoEngine">—</b></div>
        <div class="info-row"><span>状态</span><b id="infoStatus">—</b></div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btnNew" type="button">新对局</button>
        <button class="btn" id="btnPass" type="button">停一手</button>
        <button class="btn" id="btnUndo" type="button">悔棋</button>
        <button class="btn danger" id="btnResign" type="button">认输</button>
        <button class="btn" id="btnSgf" type="button">导出 SGF</button>
      </div>
      <div class="sub-panel hidden" id="newGamePanel">
        <div class="sub-title">新对局设置</div>
        <div class="choice-row">
          <label><input type="radio" name="humanColor" value="black" checked> 执黑</label>
          <label><input type="radio" name="humanColor" value="white"> 执白</label>
          <label><input type="radio" name="humanColor" value="none"> 观战</label>
        </div>
        <div class="choice-row">
          <label>贴目 <input type="number" id="newKomi" value="7.5" step="0.5" min="0" max="30"></label>
        </div>
        <div class="btn-row">
          <button class="btn primary" id="btnNewStart" type="button">开始对局</button>
          <button class="btn ghost" id="btnNewCancel" type="button">取消</button>
        </div>
      </div>
    </section>

    <!-- 竞技台面板 -->
    <section class="card hidden" id="arenaPanel">
      <h2>竞技台记分板</h2>
      <div class="score-grid">
        <div class="score-cell black">
          <div class="score-name" id="arenaBlackName">黑方引擎</div>
          <div class="score-num" id="arenaBlackWins">0</div>
          <div class="score-sub">胜局</div>
        </div>
        <div class="score-cell">
          <div class="score-name">和棋</div>
          <div class="score-num" id="arenaDraws">0</div>
          <div class="score-sub">局</div>
        </div>
        <div class="score-cell white">
          <div class="score-name" id="arenaWhiteName">白方引擎</div>
          <div class="score-num" id="arenaWhiteWins">0</div>
          <div class="score-sub">胜局</div>
        </div>
      </div>
      <div class="winbar">
        <div class="wb-black" id="winbarBlack" style="width:33%"></div>
        <div class="wb-draw" id="winbarDraw" style="width:34%"></div>
        <div class="wb-white" id="winbarWhite" style="width:33%"></div>
      </div>
      <div class="info-grid">
        <div class="info-row"><span>当前局</span><b id="arenaGameIndex">—</b></div>
        <div class="info-row"><span>已赛</span><b id="arenaGamesPlayed">—</b></div>
        <div class="info-row"><span>状态</span><b id="arenaStatus">—</b></div>
        <div class="info-row"><span>速度</span><b id="arenaSpeedText">—</b></div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btnArenaStart" type="button">开始 / 继续</button>
        <button class="btn" id="btnArenaPause" type="button">暂停</button>
        <button class="btn" id="btnArenaStep" type="button">单步</button>
        <button class="btn" id="btnArenaNext" type="button">下一局</button>
        <button class="btn danger" id="btnArenaReset" type="button">重置比分</button>
      </div>
      <div class="ctrl-row">
        <label class="slider-label">
          速度
          <input type="range" id="arenaSpeed" min="100" max="3000" step="50" value="1200">
          <b id="arenaSpeedValue">1200 ms/手</b>
        </label>
        <label class="switch"><input type="checkbox" id="arenaAutoNext"> 自动开下一局</label>
      </div>
    </section>

    <!-- 走子列表（两种模式共用） -->
    <section class="card">
      <div class="card-head">
        <h2>走子列表</h2>
        <span class="muted" id="moveCount">共 0 手</span>
      </div>
      <ol class="move-list" id="moveList"></ol>
    </section>
  </aside>
</main>

<script>
  'use strict';

  /* ===================== DOM 引用与全局状态 ===================== */
  function $(id) { return document.getElementById(id); }

  var state = null;          // 最近一次 /api/state 的完整局面状态
  var actionBusy = false;    // 普通动作请求进行中（防重复提交）
  var engineBusy = false;    // 引擎走子请求进行中
  var engineScheduled = false;
  var evalBusy = false;      // 评估请求进行中
  var aiViewOn = false;      // 「AI 视角」开关
  var showNumbers = false;   // 「显示手数」开关
  var evalData = null;       // 最近一次 /api/evaluate 结果
  var evalMoveNumber = -1;   // 评估结果对应的 move_number
  var hoverPoint = null;     // 悬停格点 {x, y}
  var boardGeom = null;      // 棋盘几何信息（像素坐标换算用）
  var pollTimer = null;
  var evalTimer = null;
  var configTimer = null;
  var configLockUntil = 0;   // 用户正在调整配置时，避免轮询覆盖控件

  /* ===================== 网络工具 ===================== */
  // 解析 JSON 响应：非 2xx 或 ok!==true 一律抛错，由错误提示条展示
  async function parseJsonResponse(res) {
    var data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok || !data || data.ok !== true) {
      var msg = (data && data.error) ? data.error : ('HTTP ' + res.status);
      throw new Error(msg);
    }
    return data;
  }
  async function fetchJson(url) {
    var res = await fetch(url);
    return await parseJsonResponse(res);
  }
  async function postJson(url, body) {
    var res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    return await parseJsonResponse(res);
  }

  function showError(message) {
    $('errorText').textContent = message;
    $('errorBar').classList.remove('hidden');
  }
  function hideError() { $('errorBar').classList.add('hidden'); }

  function escapeHtml(s) {
    return String(s === undefined || s === null ? '' : s)
      .split('&').join('&amp;')
      .split('<').join('&lt;')
      .split('>').join('&gt;')
      .split('"').join('&quot;');
  }

  /* ===================== 坐标与通用工具 ===================== */
  var COLUMN_LETTERS = 'ABCDEFGHJKLMNOPQRST'; // GTP 列名，跳过 I

  function boardSizeOf(st) {
    if (st && st.size) return st.size;
    if (st && typeof st.board === 'string') return Math.round(Math.sqrt(st.board.length));
    return 19;
  }
  function boardAt(st, x, y) {
    if (!st || typeof st.board !== 'string') return '.';
    var size = boardSizeOf(st);
    var idx = y * size + x;
    return (idx >= 0 && idx < st.board.length) ? st.board.charAt(idx) : '.';
  }
  function gtpCoord(x, y, size) { return COLUMN_LETTERS.charAt(x) + String(size - y); }
  function oppositeColor(c) { return c === 'black' ? 'white' : 'black'; }
  function colorName(c) { return c === 'black' ? '黑方' : (c === 'white' ? '白方' : '—'); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function pctText(p) {
    var v = (p || 0) * 100;
    return (v < 10 ? v.toFixed(1) : String(Math.round(v))) + '%';
  }
  function formatSigned(v) { return (v >= 0 ? '+' : '') + Number(v).toFixed(2); }

  // 终局结果文案：如「白胜 3.5 目」「黑中盘胜（认输）」「和棋」
  function resultText(r) {
    if (!r) return '对局结束';
    if (r.winner === 'draw') return '和棋';
    var name = r.winner === 'black' ? '黑' : '白';
    if (r.reason === 'resign') return name + '中盘胜（认输）';
    if (r.margin !== null && r.margin !== undefined) return name + '胜 ' + r.margin + ' 目';
    return name + '胜';
  }

  /* ===================== 棋盘渲染（高 DPI Canvas，两模式共用） ===================== */
  function computeBoardGeom(cssSize, size) {
    var pad = cssSize * 0.072;                     // 留给边缘坐标的边距
    var cell = (cssSize - pad * 2) / (size - 1);   // 格宽
    return { cssSize: cssSize, size: size, pad: pad, cell: cell };
  }
  function stoneCenter(geom, x, y) {
    return { cx: geom.pad + x * geom.cell, cy: geom.pad + y * geom.cell };
  }

  // 画一颗带径向渐变与阴影的棋子
  function drawStone(ctx, cx, cy, r, color) {
    ctx.save();
    ctx.shadowColor = 'rgba(20, 14, 6, 0.45)';
    ctx.shadowBlur = r * 0.45;
    ctx.shadowOffsetY = r * 0.22;
    var grad = ctx.createRadialGradient(cx - r * 0.38, cy - r * 0.42, r * 0.12, cx, cy, r * 1.05);
    if (color === 'black') {
      grad.addColorStop(0, '#8d939c');
      grad.addColorStop(0.38, '#3a3f47');
      grad.addColorStop(1, '#0c0e12');
    } else {
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.5, '#eceff3');
      grad.addColorStop(1, '#a7adb6');
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBoard() {
    var canvas = $('board');
    var ctx = canvas.getContext('2d');
    var cssSize = canvas.clientWidth || 640;
    var dpr = window.devicePixelRatio || 1;
    var px = Math.round(cssSize * dpr);
    if (canvas.width !== px || canvas.height !== px) { canvas.width = px; canvas.height = px; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssSize, cssSize);

    var size = state ? boardSizeOf(state) : 19;
    var geom = computeBoardGeom(cssSize, size);
    boardGeom = geom;

    // 木纹底色（渐变近似）
    var wood = ctx.createLinearGradient(0, 0, cssSize, cssSize);
    wood.addColorStop(0, '#e6c493');
    wood.addColorStop(0.45, '#d7ac76');
    wood.addColorStop(1, '#c0954f');
    ctx.fillStyle = wood;
    ctx.fillRect(0, 0, cssSize, cssSize);

    // 轻微横向纹理，增强木质感
    ctx.save();
    ctx.globalAlpha = 0.05;
    for (var i = 0; i < 16; i++) {
      ctx.fillStyle = (i % 2 === 0) ? '#7c5227' : '#fff3dd';
      ctx.fillRect(0, i * cssSize / 16, cssSize, cssSize / 32);
    }
    ctx.restore();

    // 网格线
    var x0 = geom.pad, y0 = geom.pad;
    var span = geom.cell * (size - 1);
    ctx.strokeStyle = 'rgba(30, 22, 12, 0.78)';
    ctx.lineWidth = Math.max(1, cssSize * 0.0016);
    ctx.beginPath();
    for (var g = 0; g < size; g++) {
      var p = geom.pad + g * geom.cell;
      ctx.moveTo(x0, p); ctx.lineTo(x0 + span, p);
      ctx.moveTo(p, y0); ctx.lineTo(p, y0 + span);
    }
    ctx.stroke();
    ctx.lineWidth = Math.max(1.6, cssSize * 0.0028);
    ctx.strokeRect(x0, y0, span, span);

    // 星位：19 路为 (3,3)(9,3)(15,3) 及对称共 9 个
    var starIdx = [];
    if (size >= 15) { starIdx = [3, Math.floor(size / 2), size - 4]; }
    else if (size >= 9) { starIdx = [3, size - 4]; }
    ctx.fillStyle = 'rgba(25, 18, 8, 0.9)';
    var sr = Math.max(2, geom.cell * 0.11);
    for (var si = 0; si < starIdx.length; si++) {
      for (var sj = 0; sj < starIdx.length; sj++) {
        var sc = stoneCenter(geom, starIdx[sj], starIdx[si]);
        ctx.beginPath();
        ctx.arc(sc.cx, sc.cy, sr, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 边缘坐标：上/下 A–H、J–T；左/右 19→1（y=0 为顶行，标注 19）
    var fontPx = Math.max(9, geom.cell * 0.42);
    ctx.fillStyle = 'rgba(48, 34, 16, 0.85)';
    ctx.font = '600 ' + fontPx + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var ci = 0; ci < size; ci++) {
      var letter = COLUMN_LETTERS.charAt(ci);
      var lp = geom.pad + ci * geom.cell;
      ctx.fillText(letter, lp, geom.pad * 0.45);
      ctx.fillText(letter, lp, cssSize - geom.pad * 0.45);
    }
    for (var ri = 0; ri < size; ri++) {
      var num = String(size - ri);
      var rp = geom.pad + ri * geom.cell;
      ctx.fillText(num, geom.pad * 0.45, rp);
      ctx.fillText(num, cssSize - geom.pad * 0.45, rp);
    }

    // 每个交叉点最后一次落子的序号（供「显示手数」使用）
    var moveNumbers = new Map();
    if (state && Array.isArray(state.history)) {
      for (var h = 0; h < state.history.length; h++) {
        var mv = state.history[h];
        if (mv.pass || mv.x === undefined || mv.y === undefined) continue;
        moveNumbers.set(mv.y * size + mv.x, mv.n);
      }
    }

    // 棋子 + 手数叠加
    var stoneR = geom.cell * 0.46;
    if (state && typeof state.board === 'string') {
      for (var y = 0; y < size; y++) {
        for (var x = 0; x < size; x++) {
          var ch = boardAt(state, x, y);
          if (ch !== 'B' && ch !== 'W') continue;
          var c = stoneCenter(geom, x, y);
          drawStone(ctx, c.cx, c.cy, stoneR, ch === 'B' ? 'black' : 'white');
          if (showNumbers) {
            var n = moveNumbers.get(y * size + x);
            if (n !== undefined) {
              ctx.fillStyle = (ch === 'B') ? '#f2f5f9' : '#20262e';
              ctx.font = '700 ' + Math.round(stoneR * 0.92) + 'px sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(String(n), c.cx, c.cy);
            }
          }
        }
      }
    }

    // 「AI 视角」候选着热力圈（半径与透明度按概率 p）
    if (aiViewOn && evalData && Array.isArray(evalData.top)) {
      var cands = [];
      for (var t = 0; t < evalData.top.length; t++) {
        var cand = evalData.top[t];
        if (!cand.pass && cand.x !== undefined && cand.y !== undefined) cands.push(cand);
      }
      var maxP = 0.0001;
      for (var m = 0; m < cands.length; m++) maxP = Math.max(maxP, cands[m].p || 0);
      for (var k = 0; k < cands.length; k++) {
        var t2 = cands[k];
        var norm = clamp((t2.p || 0) / maxP, 0, 1);
        var cc = stoneCenter(geom, t2.x, t2.y);
        var cr = geom.cell * (0.32 + 0.42 * norm);
        ctx.beginPath();
        ctx.fillStyle = 'rgba(224, 174, 92, ' + (0.16 + 0.5 * norm).toFixed(3) + ')';
        ctx.arc(cc.cx, cc.cy, cr, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = Math.max(1, geom.cell * 0.06);
        ctx.strokeStyle = 'rgba(240, 198, 116, 0.75)';
        ctx.stroke();
        if (k < 5) {
          var label = pctText(t2.p);
          var ly = cc.cy - geom.cell * 0.62;
          ctx.font = '700 ' + Math.round(geom.cell * 0.42) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.lineWidth = Math.max(2, geom.cell * 0.1);
          ctx.strokeStyle = 'rgba(255, 246, 224, 0.9)';
          ctx.strokeText(label, cc.cx, ly);
          ctx.fillStyle = 'rgba(52, 36, 12, 0.95)';
          ctx.fillText(label, cc.cx, ly);
        }
      }
    }

    // 悬停幽灵棋子（仅 clickable 且为合法空点时显示）
    if (state && state.clickable && !state.game_over && state.to_move && hoverPoint) {
      var hp = hoverPoint;
      var isEmpty = boardAt(state, hp.x, hp.y) === '.';
      var koBlocked = state.ko && state.ko.x === hp.x && state.ko.y === hp.y;
      if (isEmpty && !koBlocked) {
        var gc = stoneCenter(geom, hp.x, hp.y);
        ctx.save();
        ctx.globalAlpha = 0.45;
        drawStone(ctx, gc.cx, gc.cy, stoneR, state.to_move);
        ctx.restore();
      }
    }

    // 最后一手红色小圆点标记
    if (state && state.last_move && state.last_move.x !== undefined && state.last_move.y !== undefined) {
      var lc = stoneCenter(geom, state.last_move.x, state.last_move.y);
      ctx.beginPath();
      ctx.fillStyle = 'rgba(226, 76, 60, 0.95)';
      ctx.arc(lc.cx, lc.cy, Math.max(2.5, geom.cell * 0.16), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 鼠标像素坐标 → 棋盘格点
  function pointFromEvent(ev) {
    if (!boardGeom) return null;
    var rect = $('board').getBoundingClientRect();
    var px = ev.clientX - rect.left;
    var py = ev.clientY - rect.top;
    var x = Math.round((px - boardGeom.pad) / boardGeom.cell);
    var y = Math.round((py - boardGeom.pad) / boardGeom.cell);
    var size = boardGeom.size;
    if (x < 0 || y < 0 || x >= size || y >= size) return null;
    return { x: x, y: y };
  }

  /* ===================== 主渲染 ===================== */
  function render(st) {
    if (!st) return;
    state = st;
    renderHeader(st);
    renderPlayPanel(st);
    renderArenaPanel(st);
    renderMoveList(st);
    renderEvalNote();
    drawBoard();
    // 一手之后按需刷新「AI 视角」数据
    if (aiViewOn && !evalBusy) {
      if (!evalData || evalMoveNumber !== st.move_number) {
        refreshEvaluation(false).catch(function () {
          aiViewOn = false;
          $('toggleAi').checked = false;
          showError('当前引擎不支持评估');
        });
      }
    }
    maybeTriggerEngineMove();
  }

  function renderHeader(st) {
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('active', tabs[i].getAttribute('data-mode') === st.mode);
    }
    $('playPanel').classList.toggle('hidden', st.mode !== 'play');
    $('arenaPanel').classList.toggle('hidden', st.mode !== 'arena');
    $('board').classList.toggle('locked', !st.clickable);

    if (st.mode === 'arena' && st.arena) {
      $('engineBadge').innerHTML = '<b>竞技台</b> ' + escapeHtml(st.arena.black_name) +
        '（黑） vs ' + escapeHtml(st.arena.white_name) + '（白）';
    } else if (st.play) {
      var side = st.play.human_color === 'black' ? '执黑' :
        (st.play.human_color === 'white' ? '执白' : '观战');
      $('engineBadge').innerHTML = '<b>' + side + '</b> 引擎 ' + escapeHtml(st.play.engine || '—');
    } else {
      $('engineBadge').textContent = '引擎：—';
    }

    $('boardHint').textContent = (st.clickable && !st.game_over) ? '点击交叉点落子' : '（当前不可落子）';
  }

  function renderPlayPanel(st) {
    var p = st.play;
    if (!p) return;
    $('infoHuman').textContent = p.human_color === 'black' ? '执黑' :
      (p.human_color === 'white' ? '执白' : '观战');
    $('infoKomi').textContent = String(st.komi);
    var caps = st.captures || { black: 0, white: 0 };
    $('infoCaptures').textContent = '黑 ' + (caps.black || 0) + ' / 白 ' + (caps.white || 0);
    $('infoMoves').textContent = String(st.move_number);
    $('infoTurn').textContent = st.game_over ? '对局结束' :
      (st.to_move ? colorName(st.to_move) + '行棋' : '—');
    $('infoEngine').textContent = p.engine || '—';

    var thinking = !!p.busy || engineBusy || engineScheduled;
    var statusText = '等待操作';
    if (st.game_over) statusText = '对局结束';
    else if (thinking) statusText = '引擎思考中…';
    else if (p.engine_turn) statusText = '等待引擎落子';
    else if (st.clickable) statusText = '等待你落子';
    $('infoStatus').textContent = statusText;
    $('infoStatus').classList.toggle('blink', thinking);

    var busy = actionBusy || engineBusy;
    $('btnPass').disabled = busy || st.game_over || !!p.engine_turn;
    $('btnUndo').disabled = busy || !Array.isArray(st.history) || st.history.length === 0;
    $('btnResign').disabled = busy || st.game_over;
    $('btnNewStart').disabled = busy;

    // 终局结果横幅
    var banner = $('resultBanner');
    if (st.game_over) {
      banner.textContent = resultText(st.result);
      banner.classList.remove('hidden');
    } else {
      banner.classList.add('hidden');
    }
  }

  function renderArenaPanel(st) {
    var a = st.arena;
    if (!a) return;
    $('arenaBlackName').textContent = (a.black_name || '黑方引擎') + '（黑）';
    $('arenaWhiteName').textContent = (a.white_name || '白方引擎') + '（白）';
    var wins = a.wins || { black: 0, white: 0, draw: 0 };
    $('arenaBlackWins').textContent = String(wins.black || 0);
    $('arenaWhiteWins').textContent = String(wins.white || 0);
    $('arenaDraws').textContent = String(wins.draw || 0);
    var total = (wins.black || 0) + (wins.white || 0) + (wins.draw || 0);
    if (total > 0) {
      $('winbarBlack').style.width = (100 * (wins.black || 0) / total) + '%';
      $('winbarDraw').style.width = (100 * (wins.draw || 0) / total) + '%';
      $('winbarWhite').style.width = (100 * (wins.white || 0) / total) + '%';
    }
    $('arenaGameIndex').textContent = '第 ' + (a.game_index || 1) + ' 局';  // 后端 game_index 为 1 基
    $('arenaGamesPlayed').textContent = String(a.games_played || 0) + ' 局';
    $('arenaStatus').textContent = a.running ? '正在进行' : '已暂停';
    $('arenaStatus').classList.toggle('blink', !!a.running);
    $('arenaSpeedText').textContent = (a.speed_ms || 1200) + ' ms/手';

    // 用户正在调整配置时不覆盖控件
    if (Date.now() > configLockUntil) {
      $('arenaSpeed').value = String(a.speed_ms || 1200);
      $('arenaSpeedValue').textContent = (a.speed_ms || 1200) + ' ms/手';
      $('arenaAutoNext').checked = !!a.auto_next;
    }
  }

  function renderMoveList(st) {
    var hist = Array.isArray(st.history) ? st.history : [];
    $('moveCount').textContent = '共 ' + hist.length + ' 手';
    var size = boardSizeOf(st);
    var rows = [];
    for (var i = 0; i < hist.length; i++) {
      var h = hist[i];
      var coord = h.pass ? 'pass' : gtpCoord(h.x, h.y, size);
      var isLast = (i === hist.length - 1);
      rows.push(
        '<li class="' + (isLast ? 'current' : '') + '">' +
        '<span class="mv-n">' + escapeHtml(String(h.n)) + '</span>' +
        '<span class="mv-dot ' + (h.color === 'black' ? 'black' : 'white') + '"></span>' +
        '<span class="mv-coord">' + escapeHtml(coord) + '</span></li>'
      );
    }
    var list = $('moveList');
    list.innerHTML = rows.join('');
    list.scrollTop = list.scrollHeight;
  }

  // 侧栏/棋盘下方的评估文字（AI 视角、形势判断共用）
  function renderEvalNote() {
    var parts = [];
    if (aiViewOn && evalData) {
      parts.push('AI 视角：<b>' + colorName(evalData.to_move || (state ? state.to_move : null)) + '</b> 候选着' +
        (evalData.synthetic ? '（引擎预告，非模型分布）' : ''));
      var passCand = null;
      var top = Array.isArray(evalData.top) ? evalData.top : [];
      for (var i = 0; i < top.length; i++) {
        if (top[i].pass) { passCand = top[i]; break; }
      }
      if (passCand) parts.push('候选停一手概率 <b>' + pctText(passCand.p) + '</b>');
      if (evalData.value !== null && evalData.value !== undefined) parts.push(valueText(evalData));
    }
    $('evalNote').innerHTML = parts.join('　·　');
  }

  // 价值头文案：value 为当前行棋方视角
  function valueText(ev) {
    var v = ev.value;
    if (v === null || v === undefined) return '模型未提供价值头输出';
    var mover = ev.to_move || (state ? state.to_move : null);
    if (!mover) return '模型判断：value ' + formatSigned(v);
    if (Math.abs(v) < 0.02) return '模型判断：双方接近（value ' + formatSigned(v) + '）';
    var leader = v > 0 ? mover : oppositeColor(mover);
    return '模型判断：' + (leader === 'black' ? '黑方' : '白方') + '领先（value ' + formatSigned(v) + '）';
  }

  /* ===================== 评估接口（AI 视角 / 形势判断） ===================== */
  async function refreshEvaluation(withNote) {
    if (evalBusy) return null;
    evalBusy = true;
    try {
      var data = await fetchJson('/api/evaluate');
      evalData = data;
      evalMoveNumber = state ? state.move_number : -1;
      if (withNote) {
        var parts = [valueText(data)];
        if (state && state.captures) {
          parts.push('提子：黑方提 ' + (state.captures.black || 0) + ' · 白方提 ' + (state.captures.white || 0));
        }
        $('evalNote').innerHTML = parts.join('　|　');
      } else {
        renderEvalNote();
      }
      drawBoard();
      return data;
    } finally {
      evalBusy = false;
    }
  }

  // 「AI 视角」开关：开启后每 2 秒刷新一次候选着
  async function setAiView(on) {
    aiViewOn = on;
    $('toggleAi').checked = on;
    clearTimeout(evalTimer);
    if (!on) {
      evalData = null;
      renderEvalNote();
      drawBoard();
      return;
    }
    try {
      await refreshEvaluation(false);
      scheduleEvalLoop();
    } catch (e) {
      aiViewOn = false;
      $('toggleAi').checked = false;
      evalData = null;
      renderEvalNote();
      drawBoard();
      showError('当前引擎不支持评估');
    }
  }
  function scheduleEvalLoop() {
    clearTimeout(evalTimer);
    if (!aiViewOn) return;
    evalTimer = setTimeout(async function () {
      if (aiViewOn) {
        try {
          await refreshEvaluation(false);
        } catch (e) {
          aiViewOn = false;
          $('toggleAi').checked = false;
          showError('当前引擎不支持评估');
        }
      }
      scheduleEvalLoop();
    }, 2000);
  }

  /* ===================== 动作请求（统一防重复） ===================== */
  async function runAction(fn, errPrefix) {
    if (actionBusy || engineBusy) return;
    actionBusy = true;
    try {
      var next = await fn();
      if (next) render(next);
    } catch (e) {
      showError(errPrefix + '：' + e.message);
    } finally {
      actionBusy = false;
      if (state) renderPlayPanel(state);
    }
  }

  // 引擎走一步（可能耗时 0.1~1 秒）
  async function runEngineMoveOnce() {
    if (engineBusy || actionBusy) return;
    engineBusy = true;
    if (state) renderPlayPanel(state);
    try {
      var next = await postJson('/api/engine-move', {});
      render(next);
    } catch (e) {
      showError('引擎走子失败：' + e.message);
    } finally {
      engineBusy = false;
      if (state) renderPlayPanel(state);
    }
  }

  // 轮到引擎时自动调度引擎走子（含 human_color 为 none 的观战情形）
  function maybeTriggerEngineMove() {
    var st = state;
    if (!st || st.mode !== 'play' || !st.play) return;
    if (st.game_over || !st.play.engine_turn || st.play.busy) return;
    if (actionBusy || engineBusy || engineScheduled) return;
    engineScheduled = true;
    setTimeout(function () {
      engineScheduled = false;
      runEngineMoveOnce().then(maybeTriggerEngineMove);
    }, 200);
  }

  // 人类点击落子
  async function humanMove(x, y) {
    if (!state || actionBusy || engineBusy) return;
    if (!state.clickable || state.game_over) return;
    if (boardAt(state, x, y) !== '.') return;
    if (state.ko && state.ko.x === x && state.ko.y === y) return;
    actionBusy = true;
    try {
      var next = await postJson('/api/play', { x: x, y: y });
      render(next);
      if (next.play && next.play.engine_turn && !next.play.busy) {
        await runEngineMoveOnce();
      }
    } catch (e) {
      showError('落子失败：' + e.message);
    } finally {
      actionBusy = false;
      if (state) renderPlayPanel(state);
    }
  }

  // 竞技台配置提交（速度 / 自动开下一局 / komi）
  function postConfig() {
    configLockUntil = Date.now() + 1500;
    var body = {
      speed_ms: Number($('arenaSpeed').value) || 1200,
      auto_next: $('arenaAutoNext').checked,
      komi: state ? state.komi : 7.5
    };
    return runAction(function () { return postJson('/api/config', body); }, '配置失败');
  }

  // 导出 SGF 棋谱（用 /api/sgf 的文本下载 .sgf 文件）
  async function downloadSgf() {
    try {
      var res = await fetch('/api/sgf');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var text = await res.text();
      var blob = new Blob([text], { type: 'application/x-go-sgf;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'go-neuralnet-game.sgf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {
      showError('导出 SGF 失败：' + e.message);
    }
  }

  async function switchMode(mode) {
    if (state && state.mode === mode) return;
    await runAction(function () { return postJson('/api/mode', { mode: mode }); }, '切换模式失败');
    schedulePoll(); // 按新模式的频率重新轮询
  }

  /* ===================== 轮询同步 ===================== */
  function schedulePoll() {
    clearTimeout(pollTimer);
    var interval = (state && state.mode === 'arena') ? 500 : 1000;
    pollTimer = setTimeout(pollOnce, interval);
  }
  async function pollOnce() {
    if (!actionBusy && !engineBusy) {
      try {
        var st = await fetchJson('/api/state');
        render(st);
      } catch (e) {
        showError('同步局面失败：' + e.message);
      }
    }
    schedulePoll();
  }

  /* ===================== 事件绑定（集中管理） ===================== */
  function bindEvents() {
    $('errorClose').addEventListener('click', hideError);

    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      (function (btn) {
        btn.addEventListener('click', function () {
          switchMode(btn.getAttribute('data-mode'));
        });
      })(tabs[i]);
    }

    $('toggleNumbers').addEventListener('change', function () {
      showNumbers = this.checked;
      drawBoard();
    });
    $('toggleAi').addEventListener('change', function () {
      setAiView(this.checked);
    });
    $('btnEval').addEventListener('click', async function () {
      try {
        await refreshEvaluation(true);
      } catch (e) {
        showError('当前引擎不支持评估');
      }
    });

    // 新对局面板
    $('btnNew').addEventListener('click', function () {
      $('newGamePanel').classList.toggle('hidden');
    });
    $('btnNewCancel').addEventListener('click', function () {
      $('newGamePanel').classList.add('hidden');
    });
    $('btnNewStart').addEventListener('click', function () {
      var sel = document.querySelector('input[name="humanColor"]:checked');
      var humanColor = sel ? sel.value : 'black';
      var komi = Number($('newKomi').value);
      runAction(function () {
        return postJson('/api/new', {
          human_color: humanColor,
          komi: isNaN(komi) ? 7.5 : komi
        });
      }, '新对局失败').then(function () {
        $('newGamePanel').classList.add('hidden');
      });
    });

    // 对弈按钮
    $('btnPass').addEventListener('click', function () {
      runAction(function () { return postJson('/api/pass', {}); }, '停一手失败');
    });
    $('btnUndo').addEventListener('click', function () {
      runAction(function () { return postJson('/api/undo', {}); }, '悔棋失败');
    });
    $('btnResign').addEventListener('click', function () {
      runAction(function () { return postJson('/api/resign', {}); }, '认输失败');
    });
    $('btnSgf').addEventListener('click', downloadSgf);

    // 竞技台控制
    $('btnArenaStart').addEventListener('click', function () {
      runAction(function () { return postJson('/api/arena/start', {}); }, '竞技台启动失败');
    });
    $('btnArenaPause').addEventListener('click', function () {
      runAction(function () { return postJson('/api/arena/pause', {}); }, '竞技台暂停失败');
    });
    $('btnArenaStep').addEventListener('click', function () {
      runAction(function () { return postJson('/api/arena/step', {}); }, '竞技台单步失败');
    });
    $('btnArenaNext').addEventListener('click', function () {
      runAction(function () { return postJson('/api/arena/next', {}); }, '竞技台下一局失败');
    });
    $('btnArenaReset').addEventListener('click', function () {
      runAction(function () { return postJson('/api/arena/reset', {}); }, '竞技台重置失败');
    });
    $('arenaSpeed').addEventListener('input', function () {
      $('arenaSpeedValue').textContent = this.value + ' ms/手';
      clearTimeout(configTimer);
      configTimer = setTimeout(postConfig, 350);
    });
    $('arenaAutoNext').addEventListener('change', postConfig);

    // 棋盘交互：悬停幽灵棋子 + 点击落子
    var canvas = $('board');
    canvas.addEventListener('mousemove', function (ev) {
      if (!state || !state.clickable || state.game_over) {
        if (hoverPoint) { hoverPoint = null; drawBoard(); }
        return;
      }
      var p = pointFromEvent(ev);
      if ((p && hoverPoint && p.x === hoverPoint.x && p.y === hoverPoint.y) || (!p && !hoverPoint)) return;
      hoverPoint = p;
      drawBoard();
    });
    canvas.addEventListener('mouseleave', function () {
      hoverPoint = null;
      drawBoard();
    });
    canvas.addEventListener('click', function (ev) {
      var p = pointFromEvent(ev);
      if (p) humanMove(p.x, p.y);
    });

    // 尺寸变化时重绘，保持高 DPI 清晰
    window.addEventListener('resize', drawBoard);
    if (window.ResizeObserver) {
      new ResizeObserver(function () { drawBoard(); }).observe($('boardWrap'));
    }
  }

  /* ===================== 页面启动 ===================== */
  async function init() {
    bindEvents();
    try {
      var st = await fetchJson('/api/state');
      render(st);
    } catch (e) {
      showError('加载局面失败：' + e.message);
    }
    schedulePoll();
    drawBoard();
  }
  init();
</script>
</body>
</html>
